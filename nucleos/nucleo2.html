<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Núcleo 2</title>
<link rel="stylesheet" href="../css/nucleo2.css">
</head>
<body>
<!-- Fondo animado Frutiger Aero: ocupa toda la ventana, detrás del escenario -->
<canvas id="fondo-aero"></canvas>

<div id="escenario">
  <section id="p1" class="slide">
    <div class="vidrio"><h1>Núcleo 2 · Pantalla 1</h1><p>Prototipo del fondo animado estilo Frutiger Aero.</p></div>
  </section>
  <section id="p2" class="slide">
    <div class="vidrio"><h1>Pantalla 2</h1><p>El fondo sigue fluyendo mientras cambian las pantallas.</p></div>
  </section>
  <section id="p3" class="slide">
    <div class="vidrio"><h1>Pantalla 3</h1><p>Siguiente en esta pantalla termina el núcleo.</p></div>
  </section>
</div>

<script src="../libs/gsap.min.js"></script>
<script src="../js/puente.js"></script>
<script src="../js/fondo-aero.js"></script>
<script src="../js/nucleo2.js"></script>

</html>
