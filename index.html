<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infografía interactiva</title>
<style>
  :root {
    --fondo: #0e2a3b;
    --texto: #eef2ee;
    --texto-suave: #9fb4bd;
    --acento: #f2b134;
    --fade: 600ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fondo); cursor: none; }
  body.con-panel { cursor: auto; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--texto); }

  #pantalla {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vmin; gap: 2.2vmin;
  }
  #pantalla[hidden] { display: none; }
  #pantalla:focus { outline: none; }
  #pantalla h1 { font-size: clamp(2.4rem, 8vmin, 6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  #pantalla p.sub { font-size: clamp(1.1rem, 3vmin, 2rem); color: var(--texto-suave); max-width: 40ch; }
  #pantalla .aviso { margin-top: 4vmin; font-size: clamp(1rem, 2.4vmin, 1.5rem); color: var(--acento); animation: respirar 2.4s ease-in-out infinite; }
  #pantalla .aro { width: 14vmin; height: 14vmin; border-radius: 50%; border: 0.6vmin solid var(--acento); animation: pulso 2.4s ease-in-out infinite; }
  @keyframes respirar { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes pulso { 0%, 100% { transform: scale(.85); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }

  #nucleo { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #nucleo[hidden] { display: none; }

  #velo { position: fixed; inset: 0; background: #0a0a0a; opacity: 0; pointer-events: none; transition: opacity var(--fade) ease; z-index: 10; }
  #velo.activo { opacity: 1; }

  /* Pantalla de carga (dentro del velo): solo se ve si la página tarda en estar lista */
  @font-face { font-family: "Press Start 2P"; font-display: block; src: url("assets/nucleo1/fonts/PressStart2P-Regular.ttf") format("truetype"); }
  #carga {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4vmin; font-family: "Press Start 2P", monospace; color: #fff;
    opacity: 0; transition: opacity 200ms steps(2);
  }
  #velo.cargando #carga { opacity: 1; }
  #carga p { font-size: clamp(14px, 2.6vmin, 30px); letter-spacing: .1em; }
  #carga p::after { content: ""; animation: puntos 1.2s steps(4) infinite; }
  @keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  /* Barra con "bloques" que se llenan de a saltos, como la del núcleo 1 */
  #carga .barra {
    width: min(60vw, 900px); height: clamp(18px, 4vmin, 44px); padding: 0.6vmin;
    background: #1e1e28; border: 0.5vmin solid #c6ff34;
  }
  #carga .relleno {
    height: 100%; width: 0; background: repeating-linear-gradient(90deg, #c6ff34 0 22px, #a9d062 22px 26px);
  }
  #velo.cargando .relleno { animation: llenar 2.4s steps(16) infinite; }
  @keyframes llenar { 0% { width: 0; } 85%, 100% { width: 100%; } }

  /* Panel de pruebas: reemplaza a los sensores mientras desarrollás */
  #panel {
    position: fixed; right: 12px; bottom: 12px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px; padding: 10px;
    background: rgba(0,0,0,.82); border: 1px solid #ffffff30; border-radius: 10px;
    font-size: 13px; color: #fff; user-select: none;
  }
  #panel[hidden] { display: none; }
  #panel .fila { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel button {
    font: inherit; color: #fff; background: #26414f; border: 1px solid #ffffff30; border-radius: 6px;
    padding: 8px 10px; cursor: pointer;
  }
  #panel button:hover { background: #335767; }
  #panel button:active { background: var(--acento); color: #000; }
  #panel .etq { color: #9fb4bd; font-size: 11px; }
  #panel #estado { color: var(--acento); min-height: 1.2em; }

  @media (prefers-reduced-motion: reduce) {
    #pantalla .aviso, #pantalla .aro { animation: none; }
    #velo { transition-duration: 1ms; }
  }
</style>
</head>
<body>

<div id="pantalla" role="status" aria-live="polite" tabindex="-1"></div>
<iframe id="nucleo" title="Contenido" hidden></iframe>
<div id="velo">
  <div id="carga"><p>CARGANDO</p><div class="barra"><div class="relleno"></div></div></div>
</div>

<div id="panel" hidden>
  <div class="etq">Teclado → elegir núcleo</div>
  <div class="fila" id="fila-nucleos"></div>
  <div class="etq">Gesto de mano → pantalla anterior / siguiente</div>
  <div class="fila">
    <button type="button" tabindex="-1" data-accion="ANTERIOR">◀ Anterior</button>
    <button type="button" tabindex="-1" data-accion="SIGUIENTE">Siguiente ▶</button>
  </div>
  <div class="etq">Orden de núcleos (el 2 solo después del 1, etc.)</div>
  <div class="fila"><button type="button" tabindex="-1" id="btn-orden"></button></div>
  <div class="fila"><button type="button" tabindex="-1" data-accion="REINICIAR">Reiniciar</button></div>
  <div id="estado"></div>
  <div class="etq">Tecla D: ocultar/mostrar este panel</div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const CONFIG = {
  textoStandby: "Hacé el gesto para continuar",
  textoFin: "Gracias por participar",
  textoReinicio: "Hacé el gesto para volver al inicio",

  /* Tutorial de navegación: lo primero que se ve. Funciona como un núcleo más
     (sus pantallas reciben Siguiente/Anterior) y al terminarlo pasa al núcleo 1. */
  tutorial: "nucleos/tutorial.html",

  /* standby (opcional): una página propia que se muestra ANTES del núcleo, en lugar de la pantalla
     genérica. sinStandby: true → se pasa directo al núcleo, sin pantalla previa. Siguiente/Anterior en esa página los maneja el contenedor. */
  nucleos: [
    { archivo: "nucleos/nucleo1.html", titulo: "Núcleo 1", subtitulo: "Descripción corta del núcleo 1",
      standby: "nucleos/nucleo1-memoria.html" },
    { archivo: "nucleos/nucleo2.html", titulo: "Núcleo 2", subtitulo: "Descripción corta del núcleo 2",
      sinStandby: true },   // el "Inserte la memoria DOS" ya está al final del núcleo 1
    { archivo: "nucleos/nucleo3.html", titulo: "Núcleo 3", subtitulo: "Descripción corta del núcleo 3" },
    { archivo: "nucleos/nucleo-difusion.html", titulo: "Difusión", subtitulo: "Probá cómo funciona" }
  ],

  /* Qué tecla dispara qué acción. En la instalación real:
     - el teclado elige el núcleo,
     - el gesto (MediaPipe) llamará a Acciones.emitir("SIGUIENTE") / Acciones.emitir("ANTERIOR"). */
  teclas: {
    SIGUIENTE:   ["Space", "ArrowRight"],   // placeholder del gesto
    ANTERIOR:    ["KeyA", "ArrowLeft"],
    NUCLEO:      { KeyQ: 0, KeyW: 1, KeyE: 2,
                   Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 },
    REINICIAR:   "KeyR",
    PANEL:       "KeyD"
  },

  ordenObligatorio: true,  // un núcleo solo se abre si ya se abrió el anterior (se cambia desde el panel)
  panelPruebas: true,      // mostrar el panel de botones (poné false en la instalación)
  inactividadMs: 120000,   // sin actividad → vuelve al inicio (0 = desactivado)
  pantallaCompleta: true,
  fadeMs: 600
};

/* ============================================================
   SECUENCIA: tutorial → [standby 1] → núcleo 1 → standby → núcleo 2 → standby → núcleo 3 → fin
   (el primer núcleo solo lleva standby si tiene uno propio; el paso 0 es el "inicio")
   ============================================================ */
const pasos = CONFIG.tutorial ? [{ tipo: "tutorial" }] : [];
const conPantallas = tipo => tipo === "nucleo" || tipo === "tutorial";   // reciben Siguiente/Anterior
CONFIG.nucleos.forEach((n, i) => {
  if ((i > 0 && !n.sinStandby) || n.standby) pasos.push({ tipo: "standby", nucleo: i });
  pasos.push({ tipo: "nucleo", nucleo: i });
});
pasos.push({ tipo: "fin" });

/* ============================================================
   ORQUESTADOR
   ============================================================ */
const pantalla = document.getElementById("pantalla");
const iframe   = document.getElementById("nucleo");
const velo     = document.getElementById("velo");
const panel    = document.getElementById("panel");
const estado   = document.getElementById("estado");

document.documentElement.style.setProperty("--fade", CONFIG.fadeMs + "ms");

let pasoActual = 0;
let ocupado = false;
let nucleoListo = false;   // el núcleo avisa cuando ya puede recibir acciones
let alEstarListo = null;   // irA espera este aviso antes de sacar el velo
let temporizadorInactividad = null;
const visitados = new Set();   // núcleos que ya se abrieron en esta visita

const esperar = ms => new Promise(r => setTimeout(r, ms));
const avisar = txt => { estado.textContent = txt; };

function dibujarPantalla(paso) {
  let html = "";
  if (paso.tipo === "standby") {
    const n = CONFIG.nucleos[paso.nucleo];
    html = `<div class="aro"></div><h1>${n.titulo}</h1><p class="sub">${n.subtitulo}</p><p class="aviso">${CONFIG.textoStandby}</p>`;
  } else if (paso.tipo === "fin") {
    html = `<h1>${CONFIG.textoFin}</h1><p class="aviso">${CONFIG.textoReinicio}</p>`;
  }
  pantalla.innerHTML = html;
}

async function irA(indice) {
  ocupado = true;
  nucleoListo = false;
  velo.classList.add("activo");
  await esperar(CONFIG.fadeMs);

  pasoActual = indice;
  const paso = pasos[indice];
  if (indice === 0) visitados.clear();   // visitante nuevo

  const standbyPropio = paso.tipo === "standby" && CONFIG.nucleos[paso.nucleo].standby;
  if (conPantallas(paso.tipo) || standbyPropio) {
    if (paso.tipo === "nucleo") visitados.add(paso.nucleo);
    pantalla.hidden = true;
    iframe.hidden = false;
    iframe.onload = () => { try { iframe.contentWindow.focus(); } catch (e) {} };
    iframe.src = paso.tipo === "tutorial" ? CONFIG.tutorial : (standbyPropio || CONFIG.nucleos[paso.nucleo].archivo);
  } else {
    // El foco estaba dentro del iframe: al ocultarlo hay que devolvérselo al contenedor,
    // si no las teclas no le llegan a nadie hasta que se hace clic.
    // Ojo: sin esto, la carga de "about:blank" dispara el onload anterior y el iframe oculto
    // vuelve a robarse el foco.
    iframe.onload = null;
    iframe.blur();
    iframe.hidden = true;
    iframe.src = "about:blank";
    window.focus();
    pantalla.hidden = false;
    pantalla.focus({ preventScroll: true });
    dibujarPantalla(paso);
  }

  // Si se cargó una página, el velo sigue puesto hasta que avise que está lista
  // (así no se ve el núcleo anterior ni el nuevo a medio armar). Máximo 4 s por las dudas.
  // Si tarda más de medio segundo, aparece la pantalla de carga (en local casi nunca se ve).
  if (!iframe.hidden) {
    const mostrarCarga = setTimeout(() => velo.classList.add("cargando"), 500);
    await Promise.race([new Promise(r => { alEstarListo = r; }), esperar(4000)]);
    alEstarListo = null;
    clearTimeout(mostrarCarga);
    velo.classList.remove("cargando");
  }

  velo.classList.remove("activo");
  await esperar(CONFIG.fadeMs);
  ocupado = false;
  reiniciarInactividad();
}

function avanzarPaso() {
  if (ocupado) return;
  const siguiente = pasoActual + 1;
  irA(siguiente < pasos.length ? siguiente : 0);
}

function retrocederPaso() {
  if (ocupado || pasoActual === 0) return;
  irA(pasoActual - 1);
}

function irANucleo(n) {
  if (ocupado) return;
  // Si el núcleo tiene pantalla previa propia, se entra por ahí
  const tipo = CONFIG.nucleos[n] && CONFIG.nucleos[n].standby ? "standby" : "nucleo";
  const indice = pasos.findIndex(p => p.tipo === tipo && p.nucleo === n);
  if (indice === -1 || indice === pasoActual) return;
  if (CONFIG.ordenObligatorio && n > 0 && !visitados.has(n - 1)) {
    avisar("Bloqueado: primero abrí el núcleo " + n);
    return;
  }
  irA(indice);
}

function reiniciar() {
  if (ocupado || pasoActual === 0) return;
  irA(0);
}

/* ============================================================
   BUS DE ACCIONES
   Todos los sensores terminan acá. Los núcleos nunca ven teclas ni cámara.
   ============================================================ */
function emitir(accion, datos = {}) {
  reiniciarInactividad();
  const tipoPaso = pasos[pasoActual].tipo;
  avisar(accion + (datos.tipo ? " (" + datos.tipo + ")" : "") + (datos.nucleo !== undefined ? " " + (datos.nucleo + 1) : ""));

  if (accion === "IR_A_NUCLEO") { irANucleo(datos.nucleo); return; }
  if (accion === "REINICIAR")   { reiniciar(); return; }

  // Fuera de un núcleo (standby, fin), SIGUIENTE avanza en el contenedor
  if (accion === "SIGUIENTE" && !conPantallas(tipoPaso)) { avanzarPaso(); return; }
  if (accion === "ANTERIOR"  && !conPantallas(tipoPaso)) { retrocederPaso(); return; }

  // Dentro de un núcleo, el núcleo decide qué hacer con la acción
  if (conPantallas(tipoPaso) && nucleoListo && !ocupado) {
    iframe.contentWindow.postMessage({ origen: "contenedor", tipo: "accion", accion, datos }, "*");
  }
}
window.Acciones = { emitir };   // <- acá se enchufa MediaPipe más adelante

/* ---------- Inactividad ---------- */
function reiniciarInactividad() {
  clearTimeout(temporizadorInactividad);
  if (CONFIG.inactividadMs > 0 && pasoActual !== 0) {
    temporizadorInactividad = setTimeout(reiniciar, CONFIG.inactividadMs);
  }
}

/* ---------- Teclado (llega tanto del contenedor como reenviado por los núcleos) ---------- */
function procesarTecla(code, abajo) {
  const T = CONFIG.teclas;

  if (!abajo) return false;

  if (T.SIGUIENTE.includes(code))        { emitir("SIGUIENTE"); return true; }
  if (T.ANTERIOR.includes(code))         { emitir("ANTERIOR"); return true; }
  if (code in T.NUCLEO)                  { emitir("IR_A_NUCLEO", { nucleo: T.NUCLEO[code] }); return true; }
  if (code === T.REINICIAR)              { emitir("REINICIAR"); return true; }
  if (code === T.PANEL)                  { alternarPanel(); return true; }
  return false;
}

function pidePantallaCompleta() {
  if (CONFIG.pantallaCompleta && !document.fullscreenElement) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) { e.preventDefault(); return; }
  pidePantallaCompleta();
  if (procesarTecla(e.code, true)) e.preventDefault();
});
window.addEventListener("keyup", (e) => {
  if (procesarTecla(e.code, false)) e.preventDefault();
});

/* ---------- Mensajes desde los núcleos ---------- */
window.addEventListener("message", (e) => {
  if (e.source !== iframe.contentWindow) return;
  const msg = e.data;
  if (!msg || msg.origen !== "infografia") return;

  switch (msg.tipo) {
    case "listo":      nucleoListo = true; if (alEstarListo) alEstarListo(); break;
    case "terminado":  nucleoListo = false; avanzarPaso(); break;
    case "volver":     nucleoListo = false; retrocederPaso(); break;
    case "actividad":  reiniciarInactividad(); break;
    case "reiniciar":  reiniciar(); break;
    case "tecla":      procesarTecla(msg.code, msg.abajo); break;   // teclas con el foco dentro del núcleo
  }
});

/* ---------- Panel de pruebas ---------- */
function alternarPanel() {
  panel.hidden = !panel.hidden;
  document.body.classList.toggle("con-panel", !panel.hidden);
}

(function armarPanel() {
  const fila = document.getElementById("fila-nucleos");
  CONFIG.nucleos.forEach((n, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.tabIndex = -1; b.textContent = "Núcleo " + (i + 1);
    b.addEventListener("click", () => emitir("IR_A_NUCLEO", { nucleo: i }));
    fila.appendChild(b);
  });
  panel.querySelectorAll("[data-accion]").forEach(b =>
    b.addEventListener("click", () => emitir(b.dataset.accion)));

  const bo = document.getElementById("btn-orden");
  const pintarOrden = () => { bo.textContent = CONFIG.ordenObligatorio ? "🔒 Orden activado" : "🔓 Orden desactivado"; };
  bo.addEventListener("click", () => { CONFIG.ordenObligatorio = !CONFIG.ordenObligatorio; pintarOrden(); });
  pintarOrden();

  // Evita que los botones del panel roben el foco y reaccionen a Espacio/Enter
  panel.addEventListener("mousedown", e => e.preventDefault());

  if (CONFIG.panelPruebas) alternarPanel();
})();

/* ---------- Arranque ---------- */
irA(0);
window.focus();
</script>
</body>
</html>
