<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infografía interactiva</title>
<style>
  :root {
    --fondo: #0e2a3b;
    --texto: #eef2ee;
    --texto-suave: #9fb4bd;
    --acento: #f2b134;
    --fade: 600ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fondo); cursor: none; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--texto); }

  /* Pantallas del contenedor (inicio, standby, fin) */
  #pantalla {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vmin; gap: 2.2vmin;
  }
  #pantalla[hidden] { display: none; }
  #pantalla h1 { font-size: clamp(2.4rem, 8vmin, 6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  #pantalla p.sub { font-size: clamp(1.1rem, 3vmin, 2rem); color: var(--texto-suave); max-width: 40ch; }
  #pantalla .aviso {
    margin-top: 4vmin; font-size: clamp(1rem, 2.4vmin, 1.5rem); color: var(--acento);
    animation: respirar 2.4s ease-in-out infinite;
  }
  #pantalla .aro {
    width: 14vmin; height: 14vmin; border-radius: 50%;
    border: 0.6vmin solid var(--acento);
    animation: pulso 2.4s ease-in-out infinite;
  }
  @keyframes respirar { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes pulso { 0%, 100% { transform: scale(.85); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }

  /* Núcleo (iframe) */
  #nucleo { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #nucleo[hidden] { display: none; }

  /* Velo para las transiciones */
  #velo { position: fixed; inset: 0; background: var(--fondo); opacity: 0; pointer-events: none; transition: opacity var(--fade) ease; z-index: 10; }
  #velo.activo { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #pantalla .aviso, #pantalla .aro { animation: none; }
    #velo { transition-duration: 1ms; }
  }
</style>
</head>
<body>

<div id="pantalla" role="status" aria-live="polite"></div>
<iframe id="nucleo" title="Contenido" hidden></iframe>
<div id="velo"></div>

<script>
/* ============================================================
   CONFIGURACIÓN: lo único que necesitás tocar
   ============================================================ */
const CONFIG = {
  titulo: "Título de tu infografía",
  subtitulo: "Subtítulo o bajada",
  textoInicio: "Presioná una tecla para empezar",
  textoStandby: "Presioná una tecla para continuar",
  textoFin: "Gracias por participar",
  textoReinicio: "Presioná una tecla para volver al inicio",

  nucleos: [
    { archivo: "nucleos/nucleo1.html", titulo: "Núcleo 1", subtitulo: "Descripción corta del núcleo 1" },
    { archivo: "nucleos/nucleo2.html", titulo: "Núcleo 2", subtitulo: "Descripción corta del núcleo 2" },
    { archivo: "nucleos/nucleo3.html", titulo: "Núcleo 3", subtitulo: "Descripción corta del núcleo 3" }
  ],

  teclasAvanzar: ["Space", "Enter", "ArrowRight"], // ideal para un botón físico mapeado a una tecla
  teclaReiniciar: "KeyR",                           // vuelve al inicio desde cualquier pantalla
  inactividadMs: 120000,                            // 2 min sin actividad → vuelve al inicio (0 = desactivado)
  pantallaCompleta: true,                           // entra en pantalla completa con la primera tecla
  fadeMs: 600
};

/* ============================================================
   SECUENCIA DE PASOS (se arma sola a partir de CONFIG.nucleos)
   inicio → núcleo 1 → standby → núcleo 2 → standby → núcleo 3 → fin
   ============================================================ */
const pasos = [{ tipo: "inicio" }];
CONFIG.nucleos.forEach((_, i) => {
  if (i > 0) pasos.push({ tipo: "standby", nucleo: i });
  pasos.push({ tipo: "nucleo", nucleo: i });
});
pasos.push({ tipo: "fin" });

/* ============================================================
   ORQUESTADOR
   ============================================================ */
const pantalla = document.getElementById("pantalla");
const iframe   = document.getElementById("nucleo");
const velo     = document.getElementById("velo");

document.documentElement.style.setProperty("--fade", CONFIG.fadeMs + "ms");

let pasoActual = 0;
let ocupado = false;     // evita doble avance durante una transición
let temporizadorInactividad = null;

const esperar = ms => new Promise(r => setTimeout(r, ms));

function dibujarPantalla(paso) {
  let html = "";
  if (paso.tipo === "inicio") {
    html = `<h1>${CONFIG.titulo}</h1><p class="sub">${CONFIG.subtitulo}</p><p class="aviso">${CONFIG.textoInicio}</p>`;
  } else if (paso.tipo === "standby") {
    const n = CONFIG.nucleos[paso.nucleo];
    html = `<div class="aro"></div><h1>${n.titulo}</h1><p class="sub">${n.subtitulo}</p><p class="aviso">${CONFIG.textoStandby}</p>`;
  } else if (paso.tipo === "fin") {
    html = `<h1>${CONFIG.textoFin}</h1><p class="aviso">${CONFIG.textoReinicio}</p>`;
  }
  pantalla.innerHTML = html;
}

async function irA(indice) {
  ocupado = true;
  velo.classList.add("activo");
  await esperar(CONFIG.fadeMs);

  pasoActual = indice;
  const paso = pasos[indice];

  if (paso.tipo === "nucleo") {
    pantalla.hidden = true;
    iframe.hidden = false;
    iframe.onload = () => { try { iframe.contentWindow.focus(); } catch (e) {} };
    iframe.src = CONFIG.nucleos[paso.nucleo].archivo;
  } else {
    iframe.hidden = true;
    iframe.src = "about:blank";   // descarga el núcleo anterior de memoria
    pantalla.hidden = false;
    dibujarPantalla(paso);
  }

  velo.classList.remove("activo");
  await esperar(CONFIG.fadeMs);
  ocupado = false;
  reiniciarInactividad();
}

function avanzar() {
  if (ocupado) return;
  const siguiente = pasoActual + 1;
  irA(siguiente < pasos.length ? siguiente : 0);
}

function reiniciar() {
  if (ocupado || pasoActual === 0) return;
  irA(0);
}

/* ---------- Inactividad (para stands/exposiciones) ---------- */
function reiniciarInactividad() {
  clearTimeout(temporizadorInactividad);
  if (CONFIG.inactividadMs > 0 && pasoActual !== 0) {
    temporizadorInactividad = setTimeout(reiniciar, CONFIG.inactividadMs);
  }
}

/* ---------- Teclado (cuando el foco está en el contenedor) ---------- */
function pidePantallaCompleta() {
  if (CONFIG.pantallaCompleta && !document.fullscreenElement) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  pidePantallaCompleta();
  reiniciarInactividad();

  if (e.code === CONFIG.teclaReiniciar) { reiniciar(); return; }

  const tipo = pasos[pasoActual].tipo;
  // Solo avanza en pantallas del contenedor. Dentro de un núcleo, avanza cuando el núcleo avisa que terminó.
  if (tipo !== "nucleo" && CONFIG.teclasAvanzar.includes(e.code)) {
    e.preventDefault();
    avanzar();
  }
});

/* ---------- Mensajes desde los núcleos (puente.js) ---------- */
window.addEventListener("message", (e) => {
  if (e.source !== iframe.contentWindow) return;
  const msg = e.data;
  if (!msg || msg.origen !== "infografia") return;

  if (msg.tipo === "terminado")  avanzar();
  if (msg.tipo === "actividad")  reiniciarInactividad();
  if (msg.tipo === "reiniciar")  reiniciar();
});

/* ---------- Arranque ---------- */
dibujarPantalla(pasos[0]);
window.focus();
</script>
</body>
</html>
