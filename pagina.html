<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #track {
      display: flex;
      height: 100vh;
      transition: transform .5s ease;
    }

    section {
      min-width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: #fff;
    }

    #estado {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #c33;
      z-index: 10;
    }

    #estado.ok {
      background: #3c3;
    }
  </style>
</head>

<body>
  <div id="estado"></div>
  <div id="track"></div>

  <script>
    const CANTIDAD = 10;

    const track = document.getElementById('track');
    const estado = document.getElementById('estado');

    // genero las pantallas, cada una con un color distinto
    for (let i = 0; i < CANTIDAD; i++) {
      const s = document.createElement('section');
      s.style.background = `hsl(${(i * 360 / CANTIDAD)}, 60%, 35%)`;
      s.textContent = `Pantalla ${i + 1}`;
      track.appendChild(s);
    }

    const total = track.children.length;
    let pagina = 0;

    function ir(n) {
      pagina = Math.max(0, Math.min(total - 1, n));
      track.style.transform = `translateX(-${pagina * 100}vw)`;
    }

    function conectar() {
      const ws = new WebSocket('ws://localhost:9980');
      ws.onopen = () => { estado.classList.add('ok'); console.log('conectado'); };
      ws.onmessage = (e) => {
        console.log('mensaje:', e.data);
        if (e.data === 'siguiente') ir(pagina + 1);
        if (e.data === 'anterior') ir(pagina - 1);
      };
      ws.onclose = () => {
        estado.classList.remove('ok');
        setTimeout(conectar, 1000);
      };
    }
    conectar();
  </script>
</body>

</html>
